<svg xmlns="http://www.w3.org/2000/svg" width="860" height="576" viewBox="0 0 860 576" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
  <style>
    .bg{fill:#0a0e12}
    .chrome{fill:#11161c}
    .t{font-size:14px;fill:#9fb3c8;white-space:pre}
    .g{fill:#39ff7a}
    .dim{fill:#52677d}
    .y{fill:#ffd866}
    .c{fill:#56c8ff}
    .m{fill:#ff6ac1}
    .r{fill:#ff5c57}

    .line{opacity:0}
    @keyframes show{to{opacity:1}}
    .l1{animation:show .01s 0.4s forwards}
    .l2{animation:show .01s 1.6s forwards}
    .l3{animation:show .01s 2.1s forwards}
    .l4{animation:show .01s 2.6s forwards}
    .l5{animation:show .01s 3.1s forwards}
    .l6{animation:show .01s 4.0s forwards}
    .l7{animation:show .01s 5.0s forwards}
    .l8{animation:show .01s 5.4s forwards}
    .l9{animation:show .01s 5.8s forwards}
    .l10{animation:show .01s 6.2s forwards}
    .l11{animation:show .01s 6.6s forwards}
    .l12{animation:show .01s 7.6s forwards}
    .l13{animation:show .01s 8.4s forwards}
    .l14{animation:show .01s 8.9s forwards}
    .l15{animation:show .01s 9.3s forwards}
    .l16{animation:show .01s 9.7s forwards}
    .l17{animation:show .01s 10.1s forwards}
    .l18{animation:show .01s 10.6s forwards}
    .l19{animation:show .01s 11.0s forwards}
    .l20{animation:show .01s 12.0s forwards}

    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes curon{to{opacity:1}}
    .cursor{opacity:0;animation:curon .01s 12.2s forwards, blink 1s step-end infinite 12.3s}

    @keyframes sweep{from{transform:translateY(-40px)}to{transform:translateY(586px)}}
    .scan{animation:sweep 7s linear infinite;opacity:.05}

    @media (prefers-reduced-motion: reduce){ .line{opacity:1;animation:none} .scan{display:none} .cursor{opacity:1;animation:none} }
  </style>

  <rect class="bg" width="860" height="576" rx="10"/>
  <rect class="chrome" width="860" height="34" rx="10"/>
  <rect class="chrome" y="20" width="860" height="14"/>
  <circle cx="22" cy="17" r="6" fill="#ff5c57"/>
  <circle cx="42" cy="17" r="6" fill="#ffd866"/>
  <circle cx="62" cy="17" r="6" fill="#39ff7a"/>
  <text x="430" y="22" text-anchor="middle" font-size="12" class="dim">henrique@vps: ~/ops</text>

  <rect class="scan g" x="0" width="860" height="3"/>

  <g class="t">
    <text class="line l1" x="20" y="64" xml:space="preserve"><tspan class="g">henrique@vps</tspan><tspan class="dim">:</tspan><tspan class="c">~/ops</tspan><tspan class="dim">$ </tspan>whoami --verbose</text>
    <text class="line l2" x="20" y="90" xml:space="preserve"><tspan class="m">  name    </tspan>Henrique V. Melo</text>
    <text class="line l3" x="20" y="112" xml:space="preserve"><tspan class="m">  role    </tspan>DevSecOps intern <tspan class="dim">@ </tspan><tspan class="y">Netglobe Cybersecurity</tspan><tspan class="dim">  # a partir de dez/2026</tspan></text>
    <text class="line l4" x="20" y="134" xml:space="preserve"><tspan class="m">  antes   </tspan>Dev Fullstack <tspan class="dim">@ </tspan>HRB Imports<tspan class="dim">  # autopeças no Mercado Livre</tspan></text>
    <text class="line l5" x="20" y="156" xml:space="preserve"><tspan class="m">  base    </tspan>Hortolândia, SP <tspan class="dim">→ destino: </tspan><tspan class="y">anywhere</tspan></text>
    <text class="line l6" x="20" y="192" xml:space="preserve"><tspan class="g">henrique@vps</tspan><tspan class="dim">:</tspan><tspan class="c">~/ops</tspan><tspan class="dim">$ </tspan>docker ps --format "{{.Names}}  {{.Status}}"</text>
    <text class="line l7" x="20" y="218" xml:space="preserve"><tspan class="c">  myrias-api      </tspan><tspan class="g">Up (healthy)</tspan><tspan class="dim">   # Spring Boot, prod</tspan></text>
    <text class="line l8" x="20" y="240" xml:space="preserve"><tspan class="c">  myrias-web      </tspan><tspan class="g">Up (healthy)</tspan><tspan class="dim">   # Vue 3</tspan></text>
    <text class="line l9" x="20" y="262" xml:space="preserve"><tspan class="c">  postgres        </tspan><tspan class="g">Up (healthy)</tspan></text>
    <text class="line l10" x="20" y="284" xml:space="preserve"><tspan class="c">  redis-queue     </tspan><tspan class="g">Up (healthy)</tspan><tspan class="dim">   # fila de jobs distribuída</tspan></text>
    <text class="line l11" x="20" y="306" xml:space="preserve"><tspan class="c">  llm-agent       </tspan><tspan class="y">Paused      </tspan><tspan class="dim">   # esperando um humano aprovar</tspan></text>
    <text class="line l12" x="20" y="342" xml:space="preserve"><tspan class="g">henrique@vps</tspan><tspan class="dim">:</tspan><tspan class="c">~/ops</tspan><tspan class="dim">$ </tspan>nmap -sV skills/</text>
    <text class="line l13" x="20" y="368" xml:space="preserve"><tspan class="dim">  PORT      STATE     SERVICE</tspan></text>
    <text class="line l14" x="20" y="390" xml:space="preserve">  8080/tcp  <tspan class="g">open      </tspan>Java 21 <tspan class="dim">/ </tspan>Spring Boot 3 <tspan class="dim">/ </tspan>PostgreSQL <tspan class="dim">/ </tspan>Redis</text>
    <text class="line l15" x="20" y="412" xml:space="preserve">  8000/tcp  <tspan class="g">open      </tspan>Python <tspan class="dim">/ </tspan>FastAPI <tspan class="dim">/ </tspan>scraping</text>
    <text class="line l16" x="20" y="434" xml:space="preserve">  5173/tcp  <tspan class="g">open      </tspan>Vue 3 <tspan class="dim">/ </tspan>Angular <tspan class="dim">/ </tspan>TypeScript</text>
    <text class="line l17" x="20" y="456" xml:space="preserve">  2375/tcp  <tspan class="g">open      </tspan>Docker <tspan class="dim">/ </tspan>Linux <tspan class="dim">/ </tspan>GitHub Actions</text>
    <text class="line l18" x="20" y="478" xml:space="preserve">  9090/tcp  <tspan class="y">filtered  </tspan>Go <tspan class="dim">(aprendendo)</tspan></text>
    <text class="line l19" x="20" y="500" xml:space="preserve">   443/tcp  <tspan class="y">filtered  </tspan>AppSec <tspan class="dim">(PortSwigger, OWASP)</tspan></text>
    <text class="line l20" x="20" y="536" xml:space="preserve"><tspan class="g">henrique@vps</tspan><tspan class="dim">:</tspan><tspan class="c">~/ops</tspan><tspan class="dim">$ </tspan><tspan class="cursor g">█</tspan></text>
  </g>
</svg>
